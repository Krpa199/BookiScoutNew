# Local development & production deployment template.
#
# Local test:    docker compose up --build
# Production:    same file ships to Droplet; uses pre-built image from GHCR.
#
# Two services:
#   - bookiscout: Next.js standalone server
#   - caddy: reverse proxy with automatic HTTPS (production only — disabled locally)

services:
  bookiscout:
    # In production this becomes: image: ghcr.io/krpa199/bookiscoutnew:latest
    # Locally we build from the Dockerfile in this directory.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be passed at BUILD time —
        # Next.js inlines them into the client-side JavaScript bundle.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: bookiscout
    restart: unless-stopped
    env_file:
      # Load all env vars from .env.local (NEXT_PUBLIC_* + secrets like SUPABASE_SERVICE_ROLE_KEY)
      - .env.local
    ports:
      # Bind to localhost only — Caddy handles public exposure on prod.
      # For local testing without Caddy, change to "3000:3000".
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Caddy is commented out for local dev (we hit Next directly on :3000).
  # Uncomment + populate Caddyfile on the production Droplet.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - bookiscout

