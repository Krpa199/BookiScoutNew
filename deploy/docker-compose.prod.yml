# Production docker-compose for DigitalOcean Droplet.
# Lives at: /opt/bookiscout/docker-compose.yml on the server.
#
# Pulls pre-built image from GitHub Container Registry instead of building locally.
# The actual build happens in GitHub Actions (free for public repos).

services:
  bookiscout:
    # Image built and pushed by .github/workflows/deploy-droplet.yml
    image: ghcr.io/krpa199/bookiscoutnew:latest
    container_name: bookiscout
    restart: unless-stopped
    # No public port — only Caddy can talk to it via the internal network
    expose:
      - "3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - bookiscout-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      bookiscout:
        condition: service_healthy
    networks:
      - bookiscout-net

networks:
  bookiscout-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
