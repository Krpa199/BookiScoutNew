name: Supabase Keepalive

# Free Supabase projects pause after ~7 days without database activity, which
# took Stay Check down for months in 2026. This pings once a day (big margin
# for delayed/skipped GitHub cron runs) via keepalive_ping() — a real DB write.
# If the ping fails the run fails and GitHub emails the repo owner.
# SQL setup: supabase/keepalive.sql

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            response=$(curl -s -w '\n%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)
            if [ "$status" = "200" ]; then
              echo "OK — pinged_at: $body"
              exit 0
            fi
            echo "Attempt $attempt failed (HTTP $status): $body"
            sleep $((attempt * 30))
          done
          echo "::error::Supabase keepalive failed — project may be paused. Restore it in the Supabase dashboard."
          exit 1
