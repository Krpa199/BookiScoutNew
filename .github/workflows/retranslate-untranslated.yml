name: Retranslate English-only Articles

# Manual-only. Fixes kuna prices, then re-translates ~600 articles that were stored in English under
# another language (scripts/retranslate-untranslated.ts), commits, deploys.
# Shares the gemini-generation concurrency group, so it queues behind any
# running generation job instead of hammering the same API key in parallel.

on:
  workflow_dispatch:
    inputs:
      round:
        description: 'Self-continuation round (set automatically; stops after 5)'
        required: false
        default: '1'
        type: string

concurrency:
  group: gemini-generation
  cancel-in-progress: false

env:
  GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}

jobs:
  retranslate:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # stay under GitHub's 6h job cap so the save/continue steps still run
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci)

      # Both scripts save each article as they go. They share one time budget
      # (`timeout` against DEADLINE) so the commit/continue steps below always
      # get to run: a manual cancel or a job-level timeout kills the runner
      # before those steps and throws the whole run's work away.
      - name: Set time budget
        run: echo "DEADLINE=$(( $(date +%s) + 300 * 60 ))" >> $GITHUB_ENV

      # Kuna fix first, so retranslations start from corrected EN originals.
      # (GitHub keeps only ONE pending run per concurrency group, so the two
      # jobs can't be queued separately — the second would cancel the first.)
      - name: Fix kuna prices
        run: |
          LEFT=$(( DEADLINE - $(date +%s) ))
          [ "$LEFT" -gt 60 ] || exit 0
          timeout -k 30 "$LEFT" node --import tsx scripts/fix-kuna.ts || [ $? -eq 124 ]

      - name: Retranslate
        if: always()
        run: |
          LEFT=$(( DEADLINE - $(date +%s) ))
          [ "$LEFT" -gt 60 ] || exit 0
          timeout -k 30 "$LEFT" node --import tsx scripts/retranslate-untranslated.ts || [ $? -eq 124 ]

      - name: Upload retranslate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retranslate-report-round-${{ github.event.inputs.round || '1' }}
          path: retranslate-report.json
          if-no-files-found: ignore

      - name: Commit and push
        id: push
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/articles
          if git diff --staged --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "🌍 Euro prices + retranslate English-only articles $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && echo "push_success=true" >> $GITHUB_OUTPUT && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 15
          done
          exit 1

      - name: Trigger Hetzner deploy
        if: always() && steps.push.outputs.push_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-droplet.yml --ref main

      # ~600 articles take longer than one job may run. The script skips what
      # is already translated, so queue another round while any remain. Capped
      # at 5 rounds (articles that keep failing the quality gate stay listed).
      # Not chained back to the hub generator: it hands over to this job when
      # it finishes, so chaining back would ping-pong.
      - name: Continue if articles remain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ github.event.inputs.round || '1' }}
        run: |
          git pull -q origin main || true
          LEFT=$(npx tsx scripts/retranslate-untranslated.ts --dry-run | grep -oE '^[0-9]+' | head -1)
          echo "Untranslated left: ${LEFT:-?} (round $ROUND)"
          if [ "${LEFT:-0}" -gt 0 ] && [ "$ROUND" -lt 5 ]; then
            gh workflow run retranslate-untranslated.yml --ref main -f round=$((ROUND + 1))
            echo "Queued round $((ROUND + 1))"
          fi
