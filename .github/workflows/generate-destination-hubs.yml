name: Generate Destination Hubs

# Manual-only. Writes rich destination hub content (src/content/destinations/)
# for every destination — priority hubs first — in all 13 languages, skipping
# what already exists. Commits whatever was generated, then deploys.

on:
  workflow_dispatch:
    inputs:
      destinations:
        description: 'Space-separated slugs (blank = all, priority hubs first)'
        required: false
        default: ''
        type: string

concurrency:
  group: gemini-generation
  cancel-in-progress: false

env:
  GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci)

      - name: Generate hubs
        run: npx tsx scripts/generate-destination-hubs.ts ${{ github.event.inputs.destinations }}

      - name: Commit and push
        id: push
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/destinations
          if git diff --staged --quiet; then
            echo "Nothing generated"
            exit 0
          fi
          git commit -m "🗺️ Generate destination hubs $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && echo "push_success=true" >> $GITHUB_OUTPUT && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 15
          done
          exit 1

      - name: Trigger Hetzner deploy
        if: always() && steps.push.outputs.push_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-droplet.yml --ref main
