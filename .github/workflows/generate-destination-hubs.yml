name: Generate Destination Hubs

# Manual-only. Writes rich destination hub content (src/content/destinations/)
# for every destination — priority hubs first — in all 13 languages, skipping
# what already exists. Commits whatever was generated, then deploys.

on:
  workflow_dispatch:
    inputs:
      destinations:
        description: 'Space-separated slugs (blank = all, priority hubs first)'
        required: false
        default: ''
        type: string
      round:
        description: 'Self-continuation round (set automatically; stops after 5)'
        required: false
        default: '1'
        type: string

concurrency:
  group: gemini-generation
  cancel-in-progress: false

env:
  GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # stay under GitHub's 6h job cap so the save/continue steps still run
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci)

      - name: Generate hubs
        # Stop the generator cleanly before the job limit so the save +
        # continue steps below always get to run.
        timeout-minutes: 320
        continue-on-error: true
        run: npx tsx scripts/generate-destination-hubs.ts ${{ github.event.inputs.destinations }}

      - name: Commit and push
        id: push
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/destinations
          if git diff --staged --quiet; then
            echo "Nothing generated"
            exit 0
          fi
          git commit -m "🗺️ Generate destination hubs $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && echo "push_success=true" >> $GITHUB_OUTPUT && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 15
          done
          exit 1

      - name: Trigger Hetzner deploy
        if: always() && steps.push.outputs.push_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-droplet.yml --ref main

      # A full run (61 places x 13 languages) takes ~9-10h, longer than one job
      # may run. If anything is still missing, queue the next round; the script
      # skips everything that already exists, so each round continues where the
      # last one stopped. Capped at 5 rounds.
      - name: Continue if hubs are incomplete
        if: always() && github.event.inputs.destinations == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ github.event.inputs.round || '1' }}
        run: |
          git pull -q origin main || true
          EXPECTED=$(( $(grep -c "slug: '" src/config/destinations.ts) * 13 ))
          HAVE=$(find src/content/destinations -name '*.json' | wc -l)
          echo "Hub files: $HAVE / $EXPECTED (round $ROUND)"
          if [ "$HAVE" -lt "$EXPECTED" ] && [ "$ROUND" -lt 5 ]; then
            gh workflow run generate-destination-hubs.yml --ref main -f round=$((ROUND + 1))
            echo "Queued round $((ROUND + 1))"
          else
            # Hubs done (or out of rounds): hand over to the retranslation
            # job, which was paused behind this one and exits fast if done.
            gh workflow run retranslate-untranslated.yml --ref main -f round=1
            echo "Handed over to retranslation"
          fi
