name: Generate Daily Articles

on:
  schedule:
    # Run every day at 8:05 AM UTC (9:05 Zagreb time, right after Google quota reset at 8:00 UTC)
    - cron: '5 8 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      articles_count:
        description: 'Number of articles to generate per run (default 20 — steady daily cadence)'
        required: false
        default: '20'
        type: string
      force_run:
        description: 'Force run even if already ran today (WARNING: may exceed free tier!)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # Support multiple API keys for rotation
  GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  # Fallback to single key if multi-key not configured
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # Dedicated key for image validation (separate quota)
  GEMINI_API_KEY_IMAGE: ${{ secrets.GEMINI_API_KEY_IMAGE }}
  # Image providers (Pexels, Unsplash, Pixabay)
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  # 20 articles per run = steady daily cadence (~7 per key × 3 keys, well under free tier limit).
  # Lower burst = better Googlebot crawl rhythm than 50-then-pause pattern.
  ARTICLES_PER_RUN: ${{ github.event.inputs.articles_count || '20' }}

jobs:
  # First job: Check if we should run
  check-quota:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if already ran today (free tier protection)
        id: check
        run: |
          # Get today's date in UTC (Google quota resets at ~8:00 UTC)
          TODAY=$(date -u +'%Y-%m-%d')
          FORCE_RUN="${{ github.event.inputs.force_run }}"

          echo "Today's date (UTC): $TODAY"
          echo "Force run: $FORCE_RUN"

          # Check if generated.json has lastRun from today
          if [ -f "src/content/generated.json" ]; then
            LAST_RUN=$(cat src/content/generated.json | grep -o '"lastRun": "[^"]*"' | cut -d'"' -f4 | cut -d'T' -f1)
            echo "Last run date: $LAST_RUN"

            if [ "$LAST_RUN" = "$TODAY" ]; then
              echo "⚠️ Already ran today ($LAST_RUN)"
              if [ "$FORCE_RUN" = "true" ]; then
                echo "⚠️ FORCE RUN enabled - proceeding anyway (may exceed free tier!)"
                echo "should_run=true" >> $GITHUB_OUTPUT
              else
                echo "⛔ Skipping to protect free tier (1500 requests/day limit)"
                echo "should_run=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "✅ Haven't run today yet - proceeding"
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ No previous run found - proceeding"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  # Second job: Generate articles (only if should_run is true)
  generate:
    needs: check-quota
    if: needs.check-quota.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 600  # 10 hour timeout for large batches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Retry npm ci up to 3 times in case of network issues
          for i in 1 2 3; do
            echo "npm ci attempt $i..."
            if npm ci; then
              echo "✅ npm ci successful"
              break
            else
              if [ $i -lt 3 ]; then
                echo "⚠️ npm ci failed, retrying in 30 seconds..."
                sleep 30
              else
                echo "❌ npm ci failed after 3 attempts"
                exit 1
              fi
            fi
          done

      - name: Show API key status
        run: |
          echo "🔑 API Key Configuration:"
          if [ -n "$GEMINI_API_KEY_1" ]; then echo "  ✅ GEMINI_API_KEY_1 configured"; else echo "  ❌ GEMINI_API_KEY_1 missing"; fi
          if [ -n "$GEMINI_API_KEY_2" ]; then echo "  ✅ GEMINI_API_KEY_2 configured"; else echo "  ❌ GEMINI_API_KEY_2 missing"; fi
          if [ -n "$GEMINI_API_KEY_3" ]; then echo "  ✅ GEMINI_API_KEY_3 configured"; else echo "  ❌ GEMINI_API_KEY_3 missing"; fi
          if [ -n "$GEMINI_API_KEY_IMAGE" ]; then echo "  ✅ GEMINI_API_KEY_IMAGE configured (image validation)"; else echo "  ⚠️ GEMINI_API_KEY_IMAGE missing (no AI image validation)"; fi
          if [ -n "$PEXELS_API_KEY" ]; then echo "  ✅ PEXELS_API_KEY configured"; else echo "  ⚠️ PEXELS_API_KEY missing"; fi
          if [ -n "$UNSPLASH_API_KEY" ]; then echo "  ✅ UNSPLASH_API_KEY configured"; else echo "  ⚠️ UNSPLASH_API_KEY missing"; fi
          if [ -n "$PIXABAY_API_KEY" ]; then echo "  ✅ PIXABAY_API_KEY configured"; else echo "  ⚠️ PIXABAY_API_KEY missing"; fi
          echo ""
          echo "📝 Will generate up to $ARTICLES_PER_RUN articles"
          echo "🛡️ Image validation limit: 1400/day (free tier protection)"

      - name: Generate articles
        run: npm run generate
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_IMAGE: ${{ secrets.GEMINI_API_KEY_IMAGE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ARTICLES_PER_RUN: ${{ env.ARTICLES_PER_RUN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new articles generated"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New articles detected"
          fi

      - name: Commit and push new articles
        id: push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "📝 Auto-generate daily articles $(date +'%Y-%m-%d')"

          # Pull any remote changes before pushing (in case commits were made during generation)
          # Retry logic to handle transient failures
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "════════════════════════════════════════"
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            echo "════════════════════════════════════════"

            # Fetch latest from remote
            git fetch origin main

            # Check if we're behind remote
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)
            BASE=$(git merge-base HEAD origin/main)

            if [ "$LOCAL" = "$REMOTE" ]; then
              echo "✅ Already up to date with remote"
            elif [ "$LOCAL" = "$BASE" ]; then
              echo "📥 We are behind remote, need to rebase/merge"
            else
              echo "📤 We have diverged from remote, need to rebase/merge"
            fi

            # Only try rebase/merge if we're not up to date
            if [ "$LOCAL" != "$REMOTE" ]; then
              # Try rebase first (cleaner history)
              echo "Trying rebase..."
              if git rebase origin/main; then
                echo "✅ Rebase successful"
              else
                echo "⚠️ Rebase failed, aborting..."
                git rebase --abort 2>/dev/null || true

                # Try merge as fallback
                echo "Trying merge instead..."
                if git merge origin/main -m "Merge remote changes" --no-edit; then
                  echo "✅ Merge successful"
                else
                  echo "⚠️ Merge failed, aborting..."
                  git merge --abort 2>/dev/null || true

                  # Last resort: reset and re-apply our changes
                  echo "🔄 Last resort: stash, reset, and re-apply..."
                  git stash || true
                  git reset --hard origin/main
                  git stash pop || true
                  git add -A
                  git commit -m "📝 Auto-generate daily articles $(date +'%Y-%m-%d') (recovered)" || true
                fi
              fi
            fi

            # Try to push
            echo "Pushing to remote..."
            if git push origin main; then
              echo "✅ Push successful!"
              echo "push_success=true" >> $GITHUB_OUTPUT
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Push failed, retrying in 15 seconds..."
                sleep 15
              fi
            fi
          done

          echo "❌ Push failed after $MAX_RETRIES attempts"
          echo "push_success=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Generate summary
        if: always()
        run: |
          echo "### 📝 Article Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count articles
          TOTAL_ARTICLES=$(find src/content/articles -name "*.json" 2>/dev/null | wc -l || echo "0")
          echo "**Total articles in repository:** $TOTAL_ARTICLES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show tracker stats if exists
          if [ -f "src/content/generated.json" ]; then
            echo "**Generation Progress:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat src/content/generated.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🛡️ **Free Tier Protection:** Max 1400 image validations/day" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Next run:** Tomorrow at 8:05 UTC (after Google quota reset)" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Vercel deploy (optional)
        if: steps.push.outputs.push_success == 'true'
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Triggered Vercel deployment"
          fi

      - name: Revalidate new articles on Hetzner (ISR cache warm-up)
        if: steps.push.outputs.push_success == 'true'
        continue-on-error: true
        run: |
          # Find article JSON files added in this commit, extract slug from filename.
          # /api/revalidate revalidates each slug across all 13 locales.
          NEW_SLUGS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null \
            | grep -oE 'src/content/articles/[a-z]+/[a-z0-9-]+\.json' \
            | sed -E 's|.*/([a-z0-9-]+)\.json|\1|' \
            | sort -u)

          if [ -z "$NEW_SLUGS" ]; then
            echo "No new article slugs detected — skipping revalidation"
            exit 0
          fi

          # Build JSON array of slugs
          SLUGS_JSON=$(echo "$NEW_SLUGS" | jq -R . | jq -s -c .)
          echo "Revalidating new slugs: $SLUGS_JSON"

          # Retry up to 3 times — deploy-droplet workflow may still be restarting the container
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/revalidate.out -w "%{http_code}" \
              -X POST https://bookiscout.com/api/revalidate \
              -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"slugs\":$SLUGS_JSON}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Revalidated: $(cat /tmp/revalidate.out)"
              exit 0
            fi
            echo "⚠️ Attempt $i failed (HTTP $HTTP_CODE): $(cat /tmp/revalidate.out)"
            sleep 30
          done
          echo "❌ Revalidation failed after 3 attempts — long-tail pages will be slow on first visit"

  # Third job: Show skip message if not running
  skip-message:
    needs: check-quota
    if: needs.check-quota.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Show skip reason
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "⛔ WORKFLOW SKIPPED"
          echo ""
          echo "Reason: Already ran today"
          echo ""
          echo "To protect the free tier (1500 requests/day), this workflow"
          echo "only runs ONCE per day. The quota resets at 8:00 UTC."
          echo ""
          echo "Next automatic run: Tomorrow at 8:05 UTC"
          echo ""
          echo "To force a run (WARNING: may exceed free tier!):"
          echo "  1. Go to Actions > Generate Daily Articles"
          echo "  2. Click 'Run workflow'"
          echo "  3. Set 'force_run' to 'true'"
          echo "════════════════════════════════════════════════════════════"

          echo "### ⛔ Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Already ran today" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To protect the free tier (1500 requests/day), this workflow only runs ONCE per day." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next run:** Tomorrow at 8:05 UTC (after Google quota reset)" >> $GITHUB_STEP_SUMMARY
